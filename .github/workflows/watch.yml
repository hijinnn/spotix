name: ticket-watch
on:
  schedule:
    # 한 번 실행이 55분 동안 30초마다 확인한다. 15분마다 다음 실행을 예약해 두면
    # 앞 실행이 끝나자마자 이어서 시작한다 (concurrency로 동시에 1개만 실행, 1개만 대기).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "텔레그램 테스트 알림만 보내기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  # 테스트 알림은 돌고 있는 감시 실행을 기다리지 않도록 그룹을 나눈다.
  group: ticket-watch-${{ inputs.test_alert && 'test' || 'watch' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npx playwright install --with-deps chromium
      - run: node check.mjs
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
          INTERVAL_SEC: 30
          DURATION_MIN: 55
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug.png, if-no-files-found: ignore }
      - name: save state
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name watcher && git config user.email watcher@users.noreply.github.com
          git add state.json && git commit -m "update state" && git push || true
