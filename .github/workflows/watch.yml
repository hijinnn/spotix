name: ticket-watch
on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency: ticket-watch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npx playwright install --with-deps chromium
      - run: node check.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug.png, if-no-files-found: ignore }
      - name: save state
        run: |
          git config user.name watcher && git config user.email watcher@users.noreply.github.com
          git add state.json && git commit -m "update state" && git push || true
